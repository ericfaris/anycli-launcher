name: Release

# Runs only when a v* tag is pushed. Tests on all three OSes, then goreleaser
# builds, signs (cosign keyless via GitHub OIDC) and publishes the release.
# The Homebrew tap and scoop bucket are updated only when the
# TAP_GITHUB_TOKEN secret exists (see docs/HANDOFF.md); without it the
# GitHub release is still published.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload assets
      id-token: write # cosign keyless signing of checksums.txt
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # goreleaser's changelog needs the history and tags
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@v4.1.4
      - uses: anchore/sbom-action/download-syft@v0.24.4
      - name: Release notes from CHANGELOG.md
        id: notes
        # Use the curated "## <version>" section when there is one, else
        # goreleaser's Conventional Commits changelog.
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 == "## " v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            echo "flag=--release-notes=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
          fi
      - name: Tap token check
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_GITHUB_TOKEN" ]; then
            echo "::notice::TAP_GITHUB_TOKEN not set: skipping the Homebrew tap and scoop bucket"
          fi
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --clean ${{ steps.notes.outputs.flag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
