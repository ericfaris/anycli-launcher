name: Go (v4)

on:
  workflow_dispatch:
  push:
    branches: [main, v4, "v4-*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: Build
        run: go build -o dist/ ./cmd/ac

  release-check:
    # Release tooling without a release: shellcheck install.sh, validate
    # .goreleaser.yaml, build every archive as a snapshot (no publishing,
    # signing or SBOM), then install from that snapshot with install.sh.
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: "0.11.0"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - name: Install shellcheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"
      - name: shellcheck install.sh
        run: shellcheck --version && shellcheck -s sh install.sh
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: check
      - name: goreleaser snapshot
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --snapshot --clean --skip=sign,sbom
      - name: install.sh from the snapshot (dash and bash)
        run: |
          mkdir -p "$RUNNER_TEMP/rel/latest/download"
          cp dist/*.tar.gz dist/*.zip dist/checksums.txt "$RUNNER_TEMP/rel/latest/download/"
          for sh in dash bash; do
            AC_RELEASES_URL="file://$RUNNER_TEMP/rel" "$sh" install.sh --dir "$RUNNER_TEMP/bin-$sh" --shell bash
            "$RUNNER_TEMP/bin-$sh/ac" --version | grep -q "anycli-launcher .*-snapshot"
          done
          test -s dist/homebrew/Casks/anycli-launcher.rb
          test -s dist/scoop/anycli-launcher.json

  shim-smoke:
    # Evals the real `ac init <shell>` output and checks `ac <name>` cds the
    # parent shell (cmd/ac/shim_e2e_test.go). AC_REQUIRE_SHELLS turns a
    # missing shell into a failure instead of a skip.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shells: bash,zsh
          - os: macos-latest
            shells: bash,zsh # macOS /bin/bash is 3.2: the shim must work there
          - os: windows-latest
            shells: pwsh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install zsh and tmux
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh tmux
      - name: tmux backend integration test
        if: runner.os == 'Linux'
        env:
          AC_REQUIRE_TMUX: "1"
        run: go test -count=1 -v -run 'TestTmuxIntegration|TestTmuxLiveness' ./internal/launch ./internal/worktree
      - name: Shim smoke test
        env:
          AC_REQUIRE_SHELLS: ${{ matrix.shells }}
        run: go test -count=1 -v -run 'TestShimE2E|TestScriptsParse' ./cmd/ac ./internal/shim
