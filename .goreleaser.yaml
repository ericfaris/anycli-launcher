# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Release config for anycli-launcher v4. Run by .github/workflows/release.yml
# on a v* tag. Local dry run (no publishing, no signing):
#   goreleaser check
#   goreleaser release --snapshot --clean --skip=sign,sbom
version: 2

project_name: anycli-launcher

builds:
  - id: ac
    main: ./cmd/ac
    binary: ac
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/ericfaris/anycli-launcher/v4/internal/buildinfo.version={{ .Version }}
      - -X github.com/ericfaris/anycli-launcher/v4/internal/buildinfo.commit={{ .FullCommit }}
      - -X github.com/ericfaris/anycli-launcher/v4/internal/buildinfo.date={{ .CommitDate }}
    # Reproducible: file times come from the commit, not the build machine.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    ids: [ac]
    # No version in the name, so install.sh/install.ps1 can fetch
    # releases/latest/download/<name> without asking the GitHub API.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Keyless (Sigstore/Fulcio via GitHub OIDC) signature of checksums.txt.
# Verify with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/ericfaris/anycli-launcher/\.github/workflows/release\.yml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes

# One SPDX SBOM per archive (needs syft on PATH).
sboms:
  - artifacts: archive

changelog:
  use: git
  sort: asc
  abbrev: 7
  filters:
    exclude:
      - '^(docs|test|ci|chore|style|build)(\(.+\))?!?:'
      - "^Merge "
  groups:
    - title: Breaking changes
      regexp: '^\w+(\(.+\))?!:'
      order: 0
    - title: Features
      regexp: '^feat(\(.+\))?:'
      order: 1
    - title: Fixes
      regexp: '^fix(\(.+\))?:'
      order: 2
    - title: Performance
      regexp: '^perf(\(.+\))?:'
      order: 3
    - title: Other
      order: 999

release:
  github:
    owner: ericfaris
    name: anycli-launcher
  # The install scripts ride along so releases/latest/download/install.sh works.
  extra_files:
    - glob: ./install.sh
    - glob: ./install.ps1
  footer: |
    Install: `brew install --cask ericfaris/tap/anycli-launcher`, `scoop install anycli-launcher` (after `scoop bucket add ericfaris https://github.com/ericfaris/scoop-bucket`),
    `curl -fsSL https://github.com/ericfaris/anycli-launcher/releases/latest/download/install.sh | sh`,
    or `go install github.com/ericfaris/anycli-launcher/v4/cmd/ac@latest`.

# Homebrew tap and scoop bucket. Both need TAP_GITHUB_TOKEN (a token with
# contents:write on the two repos; GITHUB_TOKEN can't push to other repos).
# Without it the upload is skipped and the release still succeeds.
homebrew_casks:
  - name: anycli-launcher
    ids: [default]
    binaries: [ac]
    homepage: https://github.com/ericfaris/anycli-launcher
    description: Pick a project, cd into it and launch an AI CLI there
    license: MIT
    repository:
      owner: ericfaris
      name: homebrew-tap
      branch: main
      token: '{{ index .Env "TAP_GITHUB_TOKEN" }}'
    directory: Casks
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "chore: anycli-launcher {{ .Tag }}"
    skip_upload: '{{ if index .Env "TAP_GITHUB_TOKEN" }}auto{{ else }}true{{ end }}'
    caveats: |
      Add the shell integration (it lets ac cd your shell), e.g. for zsh:
        echo 'eval "$(ac init zsh)"' >> ~/.zshrc
      Then run `ac`. `ac doctor` checks the setup.
    hooks:
      post:
        # The binaries are not notarized; without this Gatekeeper blocks ac.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/ac"]
          end

scoops:
  - name: anycli-launcher
    ids: [default]
    homepage: https://github.com/ericfaris/anycli-launcher
    description: Pick a project, cd into it and launch an AI CLI there
    license: MIT
    repository:
      owner: ericfaris
      name: scoop-bucket
      branch: main
      token: '{{ index .Env "TAP_GITHUB_TOKEN" }}'
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "chore: anycli-launcher {{ .Tag }}"
    skip_upload: '{{ if index .Env "TAP_GITHUB_TOKEN" }}auto{{ else }}true{{ end }}'

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"
